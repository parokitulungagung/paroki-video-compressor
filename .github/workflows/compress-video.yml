name: Compress Video (Batch, Self-Discovery)

on:
  repository_dispatch:
    types: [compress-video-batch]

concurrency:
  # Cegah 2 job jalan bersamaan untuk album yang sama (hindari race condition di staging)
  group: compress-video-${{ github.event.client_payload.album }}
  cancel-in-progress: false

jobs:
  compress-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup ffmpeg & jq
        run: |
          set -e
          if ! command -v jq >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends ffmpeg jq
          fi
          ffmpeg -version | head -n1
          jq --version

      - name: Ensure AWS CLI is available
        run: |
          set -e
          if ! command -v aws >/dev/null 2>&1; then
            curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
            unzip -q awscliv2.zip
            sudo ./aws/install
            rm -rf awscliv2.zip aws/
          fi
          aws --version

      - name: Scan staging & process every video, one by one
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ALBUM: ${{ github.event.client_payload.album }}
          STAGING_PREFIX: ${{ github.event.client_payload.staging_prefix }}
          TARGET_PREFIX: ${{ github.event.client_payload.target_prefix }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: bash scripts/compress-batch.sh
