name: Compress Video (Batch, Self-Discovery)

# ─────────────────────────────────────────────────────────────────────────
# Event 'compress-video-batch' — payload SELALU kecil (cuma nama album +
# prefix), TIDAK berisi daftar file:
#   {
#     "album": "Misa Natal 2024",
#     "staging_prefix": "_pending_video/Misa Natal 2024/",
#     "target_prefix":  "galerifoto/Misa Natal 2024/"
#   }
#
# Runner ini yang MEN-SCAN SENDIRI semua object di bawah staging_prefix
# (aws s3api list-objects-v2), lalu ffmpeg memprosesnya SATU-PER-SATU secara
# BERURUTAN dalam 1 job yang sama — itulah yang membuat 1 folder berisi N
# video menghasilkan 1 run GitHub Actions, bukan N run terpisah, DAN hosting
# tidak perlu tahu/mengirim daftar file video sama sekali (cukup upload
# semua file dulu ke staging, lalu kirim sinyal nama album).
#
# Nama file di staging SUDAH memakai ekstensi FINAL (lihat
# admin/api/r2_folder_upload.php sisi hosting: mp4/mov/m4v/mkv dipertahankan,
# format lain dipaksa .mp4) — jadi key final = target_prefix + relpath
# (relatif terhadap staging_prefix), TANPA workflow ini perlu tahu aturan
# normalisasi ekstensi tsb sama sekali.
# ─────────────────────────────────────────────────────────────────────────

on:
  repository_dispatch:
    types: [compress-video-batch]

jobs:
  compress-batch:
    runs-on: ubuntu-latest
    # Naikkan kalau albummu bisa berisi puluhan video besar — semuanya
    # diproses berurutan di 1 job ini, jadi totalnya bisa lama.
    timeout-minutes: 350

    steps:
      - name: Setup ffmpeg & jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg jq

      - name: Ensure AWS CLI is available
        # ubuntu-latest (24.04 "noble") tidak lagi punya paket 'awscli' di
        # apt (dihapus dari repo Ubuntu). Untungnya runner GitHub-hosted
        # SUDAH datang dengan AWS CLI v2 preinstalled, jadi biasanya cukup
        # dicek saja. Kalau suatu saat image runner berubah dan aws-cli
        # ternyata tidak ada, baru diinstall lewat installer resmi (bukan
        # apt) supaya tidak bergantung pada ketersediaan paket distro.
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            echo "aws-cli tidak ditemukan di runner, install manual via installer resmi..."
            curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
            unzip -q awscliv2.zip
            sudo ./aws/install
          fi
          aws --version

      - name: Configure R2 (S3-compatible) credentials
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials <<EOF
          [r2]
          aws_access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          EOF

      - name: Scan staging & process every video, one by one
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ALBUM: ${{ github.event.client_payload.album }}
          STAGING_PREFIX: ${{ github.event.client_payload.staging_prefix }}
          TARGET_PREFIX: ${{ github.event.client_payload.target_prefix }}
          WEBHOOK_URL: ${{ secrets.VIDEO_CALLBACK_URL }}
          WEBHOOK_SECRET: ${{ secrets.VIDEO_WEBHOOK_SECRET }}
        run: |
          set -e
          echo "Album: $ALBUM"
          echo "Staging prefix: $STAGING_PREFIX"
          echo "Target prefix:  $TARGET_PREFIX"

          # ── 1) Scan sendiri semua object video pending untuk album ini ──
          aws --endpoint-url "$R2_ENDPOINT" --profile r2 s3api list-objects-v2 \
            --bucket "$R2_BUCKET" --prefix "$STAGING_PREFIX" \
            --query 'Contents[].Key' --output json > staging_keys.json

          COUNT=$(jq 'length' staging_keys.json)
          echo "Total video ditemukan di staging: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "Tidak ada video pending untuk album ini, selesai."
            exit 0
          fi

          # ── 2) Proses satu-per-satu, BERURUTAN (bukan matrix/paralel) ──
          for i in $(seq 0 $((COUNT - 1))); do
            STAGING_KEY=$(jq -r ".[$i]" staging_keys.json)
            RELPATH="${STAGING_KEY#"$STAGING_PREFIX"}"
            TARGET_KEY="${TARGET_PREFIX}${RELPATH}"
            POSTER_KEY="${TARGET_KEY}.poster.webp"

            echo "── [$((i+1))/$COUNT] $STAGING_KEY → $TARGET_KEY ──"

            SRC="/tmp/src_$i"
            OUT="/tmp/out_$i.mp4"
            POSTER="/tmp/poster_$i.webp"
            STATUS="done"
            MESSAGE=""

            if aws --endpoint-url "$R2_ENDPOINT" --profile r2 s3 cp \
                 "s3://$R2_BUCKET/$STAGING_KEY" "$SRC"; then

              # Kompresi + convert (samakan parameter dengan
              # R2FolderCompressor::compressVideo() di sisi PHP kalau perlu).
              if ffmpeg -y -i "$SRC" \
                   -c:v libx264 -crf 29 -preset veryfast \
                   -vf "scale='min(854,iw)':'min(480,ih)':force_original_aspect_ratio=decrease:force_divisible_by=2" \
                   -c:a aac -b:a 96k \
                   -movflags +faststart \
                   "$OUT"; then

                aws --endpoint-url "$R2_ENDPOINT" --profile r2 s3 cp \
                  "$OUT" "s3://$R2_BUCKET/$TARGET_KEY" \
                  --content-type "video/mp4"

                # Poster/thumbnail dari frame ~1 detik.
                if ffmpeg -y -ss 00:00:01 -i "$OUT" -frames:v 1 \
                     -vf "scale='min(720,iw)':-2" "$POSTER" 2>/dev/null; then
                  aws --endpoint-url "$R2_ENDPOINT" --profile r2 s3 cp \
                    "$POSTER" "s3://$R2_BUCKET/$POSTER_KEY" \
                    --content-type "image/webp" || true
                fi

                # Staging sudah tidak dibutuhkan lagi — hapus.
                aws --endpoint-url "$R2_ENDPOINT" --profile r2 s3 rm \
                  "s3://$R2_BUCKET/$STAGING_KEY" || true
              else
                STATUS="failed"; MESSAGE="ffmpeg compress gagal"
              fi
            else
              STATUS="failed"; MESSAGE="download staging gagal"
            fi

            # Lapor per-video ke callback PHP (endpoint TIDAK berubah — tetap
            # dipanggil sekali per video, hanya bukan lagi per run terpisah).
            curl -sf -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Webhook-Secret: $WEBHOOK_SECRET" \
              -d "$(jq -n --arg album "$ALBUM" --arg target "$TARGET_KEY" \
                     --arg status "$STATUS" --arg message "$MESSAGE" \
                     '{album:$album, target_key:$target, status:$status, message:$message}')" \
              || echo "::warning::callback gagal untuk $TARGET_KEY"

            rm -f "$SRC" "$OUT" "$POSTER"
          done
